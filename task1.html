<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 1 - День недели</title>
</head>
<body>
    <h1>Задание 1: Перевод дня недели</h1>
    <p>Нажмите кнопку для запуска программы</p>
    <button onclick="translateDay()">Запустить</button>

    <script>
        function translateDay() {
            const russianDay = prompt("Введите день недели на русском языке:");
            
            if (russianDay === null || russianDay.trim() === "") {
                alert("Вы не ввели день недели!");
                return;
            }
            
            const day = russianDay.trim().toLowerCase();
            let englishDay;
            
            switch (day) {
                case "понедельник":
                    englishDay = "Monday";
                    break;
                case "вторник":
                    englishDay = "Tuesday";
                    break;
                case "среда":
                    englishDay = "Wednesday";
                    break;
                case "четверг":
                    englishDay = "Thursday";
                    break;
                case "пятница":
                    englishDay = "Friday";
                    break;
                case "суббота":
                    englishDay = "Saturday";
                    break;
                case "воскресенье":
                    englishDay = "Sunday";
                    break;
                default:
                    alert("Некорректный ввод! Введите день недели на русском языке.");
                    return;
            }
            
            alert("День недели на английском: " + englishDay);
        }
    </script>
</body>
</html>
