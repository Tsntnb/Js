<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задание 4 - Факториал</title>
</head>
<body>
    <h1>Задание 4: Вычисление факториала</h1>
    <p>Нажмите кнопку для запуска программы (введите число от 1 до 10)</p>
    <button onclick="calculateFactorial()">Запустить</button>

    <script>
        function calculateFactorial() {
            const input = prompt("Введите число от 1 до 10:");
            
            if (input === null || input.trim() === "") {
                alert("Вы не ввели число!");
                return;
            }
            
            const x = parseInt(input);
            
            if (isNaN(x) || x <= 0 || x > 10) {
                alert("Ошибка! Введите число в диапазоне 0 < x <= 10");
                return;
            }
            
            let factorial = 1;
            for (let i = 2; i <= x; i++) {
                factorial *= i;
            }
            
            alert("Факториал числа " + x + " равен " + factorial);
        }
    </script>
</body>
</html>
